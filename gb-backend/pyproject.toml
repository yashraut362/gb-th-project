[project]
name = "gb-backend"
version = "0.1.0"
description = "API for UK wind generation forecasts vs actuals (Elexon BMRS)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pandas>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
